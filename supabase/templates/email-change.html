<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #050505; color: #e4e4e7; padding: 40px 0; }
    .container { max-width: 480px; margin: 0 auto; padding: 32px; background-color: #0A0A0A; border: 1px solid #27272a; border-radius: 16px; text-align: center; }
    .logo { margin-bottom: 24px; font-size: 24px; font-weight: 800; color: #ffffff; }
    .button { display: inline-block; background-color: #ffffff; color: #000000; font-weight: 600; padding: 12px 32px; border-radius: 8px; text-decoration: none; margin: 24px 0; }
    .footer { font-size: 13px; color: #52525b; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">STROKE</div>
    <div style="font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 8px;">Confirm Email Change</div>
    <p style="color: #a1a1aa; font-size: 15px;">You requested to change your email address. Click the button below to confirm this change.</p>
    
    <a href="{{ .ConfirmationURL }}" class="button">Confirm Change</a>
    
    <div class="footer">
      <p>If you didn't request this, you can safely ignore it.</p>
    </div>
  </div>
</body>
</html>
