<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to STROKE</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background-color: #050505;
      color: #e4e4e7;
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      padding: 32px;
      background-color: #0A0A0A;
      border: 1px solid #27272a;
      border-radius: 16px;
      text-align: center;
    }
    .logo {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .heading {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .text {
      color: #a1a1aa;
      font-size: 15px;
      margin-bottom: 32px;
    }
    .button {
      display: inline-block;
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #e4e4e7;
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #52525b;
    }
    .link {
      color: #71717a;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">STROKE</div>
    
    <div class="heading">Your Magic Link</div>
    <p class="text">
      Click the button below to sign in to your account. This link will expire in 24 hours.
    </p>

    <a href="{{ .ConfirmationURL }}" class="button">Sign In to Stroke</a>

    <div class="footer">
      <p>If you didn't request this link, you can safely ignore this email.</p>
      <p>
        <a href="{{ .SiteURL }}" class="link">stroke.ai</a>
      </p>
    </div>
  </div>
</body>
</html>
